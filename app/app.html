<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작은 가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/pwa/icon-192.png">
<link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png">
<title>나의 작은 가계부</title>
<style>
:root{
  --bg:#FFF6EE;--line:#FCBDBB;--ink:#3A1A1B;--red:#C31246;--green:#255E49;
  --head:#FBEBE6;--soft:#FDE9E4;--white:#FFFFFF;--primary:#F4CED6;--primary-line:#DAA6B2;
  --muted:#3A1A1BA6;--track:#F0EBE5;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--white);border:2px solid var(--line);border-radius:10px;padding:9px 14px;min-height:42px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:wait}
button.primary{background:var(--primary);border-color:var(--primary-line);font-weight:700}
button.danger{color:var(--red)}
button.ghost{background:transparent;border-color:transparent}
input,select,textarea{width:100%;min-width:0;border:2px solid var(--line);border-radius:10px;background:var(--white);padding:11px 12px;outline:none;min-height:46px;font-size:16px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--ink);opacity:.45}
.hidden{display:none!important}
.px{image-rendering:pixelated;object-fit:contain}
.num{font-variant-numeric:tabular-nums}

/* layout */
.shell{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(10px + var(--safe-t)) 14px calc(156px + var(--safe-b))}
.apphead{position:relative;display:flex;align-items:flex-end;justify-content:space-between;min-height:74px;padding-top:6px}
.apphead h1{font-size:23px;margin:0 0 10px;font-weight:700;letter-spacing:-.3px}
.apphead .cat{width:118px;height:50px;margin-bottom:-2px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.monthbar .label{font-weight:700;font-size:18px;flex:1;text-align:center;background:var(--white);border:2px solid var(--line);border-radius:10px;padding:8px;position:relative}
.monthbar .label input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.monthbar button{width:46px;padding:0;font-size:18px}
.panel{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.panel-head h2{display:flex;align-items:center;gap:8px;font-size:19px;margin:0;font-weight:700;word-break:keep-all}
.panel-head h2 img{width:32px;height:32px}
.status{font-size:13px;margin:0 0 8px;padding:8px 10px;border-radius:10px;background:#FFE3E6;color:var(--red)}
.status:empty{display:none}
.demo{font-size:12px;background:#FFF3C9;border:2px solid #F2DD9B;border-radius:10px;padding:7px 10px;margin-bottom:8px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--white);border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.stat.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.stat .k{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.stat .k img{width:26px;height:26px}
.stat .v{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.wide .v{margin-left:auto;font-size:22px}
.stat .edit-hint{font-size:11px;opacity:.6;font-weight:400}
.red{color:var(--red)}.green{color:var(--green)}
.progress{height:12px;background:var(--track);border-radius:3px;margin-top:10px;overflow:hidden;border:2px solid var(--white)}
.progress i{display:block;height:100%;background:var(--line);transition:width .3s}
.progress.over i{background:var(--red)}
.progress-note{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}

/* list */
.segment{display:flex;gap:6px;margin-bottom:10px}
.segment button{flex:1;min-height:36px;padding:5px;font-size:14px}
.segment button[aria-pressed=true]{background:var(--primary);border-color:var(--primary-line);font-weight:700}
.daygroup{margin-top:10px}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:4px 4px 6px;border-bottom:2px dashed var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;background:var(--white);border:2px solid transparent;border-radius:12px;padding:9px 10px;margin-top:6px;text-align:left;min-height:56px}
.row:hover{border-color:var(--line)}
.row .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.row .ic img{width:30px;height:30px}
.row .mid{flex:1;min-width:0}
.row .t,.row .s{display:block}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;background:var(--soft);vertical-align:1px}
.empty{text-align:center;padding:26px 10px;font-size:14px;opacity:.8}
.empty img{width:120px;display:block;margin:0 auto 6px}

/* calendar */
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekdays span{text-align:center;font-weight:700;font-size:13px;padding:6px 0;background:var(--head)}
.grid{border-left:2px solid var(--line);border-top:2px solid var(--line);margin-top:0}
.cell{background:var(--white);border:0;border-right:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0;min-height:62px;padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;text-align:left;font-size:12px}
.cell.out{color:#AFA09E}
.cell.today{box-shadow:inset 0 0 0 2px var(--red)}
.cell.sel{background:var(--soft)}
.cell .d{font-weight:700}
.cell .m{margin-top:auto;font-size:10.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;color:var(--red);font-weight:700}
.cell .m.minus{color:var(--green)}
.calnote{font-size:12px;margin-top:8px;opacity:.75}

/* monthly */
.bars{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.bar{display:block;width:100%;background:transparent;border:0;padding:4px 2px;text-align:left;border-radius:8px}
.bar:hover{background:var(--soft)}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.bar .top b{font-variant-numeric:tabular-nums}
.bar .track{height:22px;background:var(--track);position:relative}
.bar .fill{height:100%;clip-path:polygon(0 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,0 100%)}
.bar .pct{font-size:11px;opacity:.7;margin-top:2px}
.sumtotal{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;border-top:2px dashed var(--line);margin-top:14px;padding-top:10px}
.sumtotal .v{font-size:20px;color:var(--red)}

/* settings */
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:58px}
.menu button img{width:32px;height:32px}
.menu button span{flex:1}
.menu button small{display:block;font-size:12px;opacity:.7}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px dashed var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .mid{flex:1;min-width:0}
.list-item .s{font-size:12px;opacity:.75}
.dot{width:22px;height:22px;border-radius:6px;border:2px solid var(--white);box-shadow:0 0 0 2px var(--line);flex-shrink:0}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:4px 0;min-height:52px;border-radius:12px}
.tabbar button img{width:28px;height:28px;opacity:.55;filter:grayscale(.5)}
.tabbar button[aria-current=page]{background:var(--soft);font-weight:700}
.tabbar button[aria-current=page] img{opacity:1;filter:none}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 264px));bottom:calc(84px + var(--safe-b));background:var(--primary);border-color:var(--primary-line);font-weight:700;border-radius:999px;padding:12px 18px;box-shadow:3px 3px 0 var(--line);font-size:16px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:#3A1A1B55;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border:2px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:8px 16px calc(18px + var(--safe-b));animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheet-head h3{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.sheet-head h3 img{width:30px;height:30px}
.sheet-head button{min-height:38px;width:38px;padding:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount-input{font-size:22px;font-weight:700;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 6px;border-radius:10px;border:2px solid transparent;min-height:40px;font-size:14px}
.chip img{width:24px;height:24px}
.chip[aria-pressed=true]{border-color:var(--ink);font-weight:700}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.actions .grow{flex:1}
.confirm{background:#FFE3E6;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:14px}
.err{color:var(--red);font-size:13px;min-height:0}
.err:empty{display:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;min-height:0;padding:0;border:3px solid var(--white);border-radius:8px;box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.swatches input[type=color]{width:34px;height:34px;min-height:0;padding:0;border-radius:8px}
.emoji-tabs{display:flex;gap:6px;margin-bottom:8px}
.emoji-tabs button{min-height:34px;padding:4px 12px}
.emoji-tabs button[aria-pressed=true]{background:var(--primary);border-color:var(--primary-line);font-weight:700}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:48vh;overflow:auto;padding:2px}
.emoji-grid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:0}
.emoji-grid button[aria-pressed=true]{background:var(--soft);border-color:var(--red)}
.emoji-grid img{width:36px;height:36px}
.emoji-grid span{font-size:10px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;animation:fade .2s}

/* login */
.login{max-width:420px;margin:12vh auto 0;text-align:center}
.login img.logo{width:96px;height:96px}
.login h1{margin:8px 0 4px;font-size:24px}
.login p{font-size:14px;opacity:.85}
.login .form{text-align:left;margin-top:18px}

@media (min-width:700px){.shell{padding-top:24px}}
</style>
</head>
<body>
<div id="login" class="shell hidden">
  <div class="login">
    <img class="logo px" src="assets/icons/02_calculator.png" alt="">
    <h1>나의 작은 가계부</h1>
    <p>노션 가계부와 연결된 앱이에요.<br>처음 한 번만 위젯 접근키를 입력해 주세요.</p>
    <form id="loginForm" class="form panel">
      <label>위젯 접근키
        <input id="loginKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="노션용-주소.txt의 #k= 뒤 값">
      </label>
      <div id="loginErr" class="err"></div>
      <button class="primary" type="submit">연결하기</button>
      <p style="font-size:12px;margin:0">노션용 주소 전체(https://…#k=…)를 붙여넣어도 돼요. 키는 이 기기에만 저장돼요.</p>
    </form>
    <p><a href="?demo=1" style="color:inherit">예시 데이터로 둘러보기</a></p>
  </div>
</div>

<div id="app" class="shell hidden">
  <div id="demo" class="demo hidden">미리보기예요. 예시 데이터이며 실제 노션에는 저장되지 않아요.</div>
  <header class="apphead">
    <h1>나의 작은 가계부</h1>
    <img class="cat px" src="assets/decoration-cat.png" alt="">
  </header>
  <div class="monthbar">
    <button id="prevMonth" aria-label="이전 달">‹</button>
    <div class="label"><span id="monthLabel"></span><input id="monthPick" type="month" aria-label="월 선택"></div>
    <button id="nextMonth" aria-label="다음 달">›</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <main id="view"></main>
</div>

<button id="fab" class="fab hidden" type="button">＋ 지출 추가</button>
<div class="tabbar hidden" id="tabbar"><nav>
  <button data-tab="records"><img class="px" src="assets/icons/01_wallet.png" alt="">기록</button>
  <button data-tab="calendar"><img class="px" src="assets/icons/03_calendar.png" alt="">달력</button>
  <button data-tab="monthly"><img class="px" src="assets/icons/14_chart.png" alt="">결산</button>
  <button data-tab="settings"><img class="px" src="assets/icons/02_calculator.png" alt="">관리</button>
</nav></div>
<div id="sheets"></div>

<script>
'use strict';
const DEMO_ICONS=[['wallet','지갑'],['calculator','계산기'],['calendar','달력'],['house','집'],['bill','고지서'],['spoon-chopsticks','숟가락_젓가락'],['book-pen','책과_필기구'],['bus','버스'],['shopping-bag','쇼핑백'],['bankbook','통장'],['banknotes','지폐'],['money-envelope','돈봉투'],['subscription-laptop','구독료_노트북'],['chart','결산차트'],['suitcase','캐리어'],['piggy-bank','저금통'],['makeup','색조화장품'],['smartphone','스마트폰'],['grocery-basket','장바구니'],['medical','청진기와_주사기'],['pet-food','사료그릇'],['credit-card','신용카드'],['knitting','뜨개질'],['clothes-shoes','옷과_구두'],['movie-ticket','영화티켓'],['car','자동차'],['book','책'],['detergent-tissue','세제와_휴지'],['chicken-box','치킨박스']].map(([f,name],i)=>({id:'demo-icon-'+i,name,url:'assets/icons/'+String(i+1).padStart(2,'0')+'_'+f+'.png'}));
const ASSET={wallet:'assets/icons/01_wallet.png',calculator:'assets/icons/02_calculator.png',calendar:'assets/icons/03_calendar.png',house:'assets/icons/04_house.png',bill:'assets/icons/05_bill.png',spoon:'assets/icons/06_spoon-chopsticks.png',chart:'assets/icons/14_chart.png',piggy:'assets/icons/16_piggy-bank.png',card:'assets/icons/22_credit-card.png',cat:'assets/decoration-cat.png',bankbook:'assets/icons/10_bankbook.png'};
const DEFAULT_SLOT={records:ASSET.wallet,calendar:ASSET.calculator,monthly:ASSET.calendar,budget:ASSET.house,total:ASSET.bill,remaining:ASSET.spoon};
const SWATCHES=['#efb5c2','#a9cfe7','#b8d1b4','#cdbce0','#efd99a','#f6c8a8','#a8d8d0','#f3a6a6','#c9b49a','#d9d0c5'];
const KEY_STORE='budget-app-key',CACHE_STORE='budget-app-cache-v1',EMOJI_STORE='budget-app-emojis-v1',DEMO_STORE='budget-app-demo-v1';
const params=new URLSearchParams(location.search);
const demo=params.get('demo')==='1'||location.protocol==='file:';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const won=n=>(n<0?'-':'')+Math.abs(Math.round(n||0)).toLocaleString('ko-KR')+'원';
const commas=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR');
const parseAmount=s=>{const t=String(s||'').replace(/[^\d-]/g,'');const neg=t.startsWith('-');const d=t.replace(/-/g,'');return d?(neg?-1:1)*Number(d):NaN};
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const seoulToday=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const shiftMonth=(m,n)=>{const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5)-1+n,1));return d.toISOString().slice(0,7)};
const lastDay=m=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5),0)).getUTCDate();
const WEEK=['일','월','화','수','목','금','토'];
const dayLabel=d=>{const x=new Date(d+'T00:00:00Z');return (+d.slice(5,7))+'월 '+(+d.slice(8))+'일 ('+WEEK[x.getUTCDay()]+')'};

let key='';
const state={month:seoulToday().slice(0,7),tab:'records',data:null,emojis:new Map(),filter:'all',selectedDay:null,loading:false};

/* ---------- API ---------- */
async function api(path,data={}){
  if(demo)return demoAPI(path,data);
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json','x-widget-key':key},body:JSON.stringify(data),signal:ctl.signal});
    let j={};try{j=await r.json()}catch{}
    if(r.status===401){logout('접근키가 맞지 않아요. 다시 입력해 주세요.');throw Error('접근키를 확인해 주세요.')}
    if(!r.ok)throw Error(j.error||'요청에 실패했어요. 잠시 후 다시 시도해 주세요.');
    return j;
  }catch(e){if(e.name==='AbortError')throw Error('응답이 늦어요. 네트워크를 확인해 주세요.');if(e instanceof TypeError)throw Error('인터넷에 연결되어 있지 않아요. 저장된 화면을 보여드려요.');throw e}
  finally{clearTimeout(timer)}
}

/* ---------- emoji ---------- */
function loadEmojiCache(){try{const v=JSON.parse(store.get(EMOJI_STORE)||'null');if(v&&Array.isArray(v.items))for(const x of v.items)state.emojis.set(x.id,x)}catch{}}
async function fetchEmojis(){
  if(demo){for(const x of DEMO_ICONS)state.emojis.set(x.id,x);return}
  const items=[];let cursor=null,guard=0;
  do{const r=await api('emojis',cursor?{cursor}:{});items.push(...r.items);cursor=r.cursor;guard++}while(cursor&&guard<20);
  state.emojis.clear();for(const x of items)state.emojis.set(x.id,x);
  store.set(EMOJI_STORE,JSON.stringify({items,at:Date.now()}));
}
function iconHTML(icon,fallback,cls='px'){
  if(icon?.type==='custom_emoji'){const e=state.emojis.get(icon.id);if(e)return `<img class="${cls}" src="${esc(e.url)}" alt="">`}
  if(icon?.type==='emoji')return `<span aria-hidden="true">${esc(icon.value)}</span>`;
  return fallback?`<img class="${cls}" src="${esc(fallback)}" alt="">`:'';
}
const slotIcon=slot=>iconHTML(state.data?.icons?.[slot],DEFAULT_SLOT[slot]);

/* ---------- data ---------- */
function catMap(){return new Map((state.data?.categories||[]).map(c=>[c.id,c]))}
function activeCats(){return (state.data?.categories||[]).filter(c=>!c.inactive)}
function catOf(id){return catMap().get(id)||{id,name:'미분류',color:'#d9d0c5',icon:null}}
function fixedForMonth(revisions,month){const latest=new Map();for(const r of revisions||[]){if(r.from<=month&&(!latest.has(r.key)||latest.get(r.key).from<r.from))latest.set(r.key,r)}return [...latest.values()].filter(r=>!r.stopped)}

async function load({quiet=false}={}){
  const month=state.month;
  if(!quiet)setStatus('');
  state.loading=true;
  try{
    const d=await api('load',{month});
    if(month!==state.month)return;
    state.data=d;
    store.set(CACHE_STORE+':'+month,JSON.stringify(d));
    setStatus('');
  }catch(e){
    if(!state.data||state.data.month!==month){const c=store.get(CACHE_STORE+':'+month);if(c){try{state.data=JSON.parse(c)}catch{}}}
    setStatus(e.message);
  }finally{state.loading=false}
  if(state.data)state.data.month=month;
  render();
}
function setStatus(m){$('#status').textContent=m||''}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}

/* ---------- render ---------- */
function render(){
  const [y,m]=state.month.split('-');
  $('#monthLabel').textContent=y+'년 '+(+m)+'월';
  $('#monthPick').value=state.month;
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false'));
  $('#fab').classList.toggle('hidden',state.tab==='settings');

  if(!state.data){v.innerHTML=`<div class="panel empty"><img class="px" src="${ASSET.cat}" alt="">${state.loading?'불러오는 중이에요…':'아직 불러온 내역이 없어요.'}</div>`;return}
  v.innerHTML=({records:renderRecords,calendar:renderCalendar,monthly:renderMonthly,settings:renderSettings})[state.tab]();
}
function statsHTML(){
  const d=state.data,budget=d.budget||0,total=d.total||0,remain=budget-total,pct=budget>0?Math.min(100,Math.round(total/budget*100)):0;
  return `<section class="panel">
    <div class="stats">
      <button class="stat wide" data-act="budget" aria-label="한 달 예산 수정"><span class="k">${slotIcon('budget')}한 달 예산 <span class="edit-hint">수정</span></span><span class="v num">${won(budget)}</span></button>
      <div class="stat"><span class="k">${slotIcon('total')}총 지출</span><span class="v num red">${won(total)}</span></div>
      <div class="stat"><span class="k">${slotIcon('remaining')}남은 예산</span><span class="v num ${remain<0?'red':'green'}">${won(remain)}</span></div>
    </div>
    <div class="progress ${remain<0?'over':''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${budget>0?pct:0}%"></i></div>
    <div class="progress-note"><span>예산의 ${budget>0?Math.round(total/budget*100):0}% 사용</span><span>${remain<0?'예산 초과':'남은 일수 '+daysLeft()+'일'}</span></div>

}
function daysLeft(){const t=seoulToday();if(t.slice(0,7)!==state.month)return t.slice(0,7)<state.month?lastDay(state.month):0;return lastDay(state.month)-(+t.slice(8))+1}
function rowHTML(r){
  const c=catOf(r.category),fixed=!!r.fixedKey,inst=/^할부 \d+\/\d+회차/.test(r.memo||'');
  return `<button class="row" data-row="${esc(r.id)}">

    <span class="a num ${r.amount<0?'green':''}">${won(r.amount)}</span>

}
function rowsByDay(rows){const g=new Map();for(const r of rows){if(!g.has(r.date))g.set(r.date,[]);g.get(r.date).push(r)}return [...g.entries()].sort((a,b)=>b[0].localeCompare(a[0]))}
function renderRecords(){
  const d=state.data,f=state.filter;
  let rows=d.rows||[];
  if(f!=='all')rows=rows.filter(r=>r.category===f);
  const cats=activeCats().filter(c=>(d.rows||[]).some(r=>r.category===c.id));
  const groups=rowsByDay(rows);
  return statsHTML()+`<section class="panel">

    ${cats.length?`<div class="chips" style="margin-bottom:6px"><button class="chip" data-filter="all" aria-pressed="${f==='all'}" style="background:var(--white)">전체</button>${cats.map(c=>`<button class="chip" data-filter="${esc(c.id)}" aria-pressed="${f===c.id}" style="background:${esc(c.color)}">${iconHTML(c.icon,'')}${esc(c.name)}</button>`).join('')}</div>`:''}
    ${groups.length?groups.map(([day,rs])=>`<div class="daygroup"><div class="dayhead"><span>${dayLabel(day)}</span><span class="num">${won(rs.reduce((s,r)=>s+r.amount,0))}</span></div>${rs.map(rowHTML).join('')}</div>`).join(''):`<div class="empty"><img class="px" src="${ASSET.cat}" alt="">이번 달 지출이 아직 없어요.<br>아래 ＋ 버튼으로 기록해 보세요.</div>`}
  </section>`;
}
function renderCalendar(){
  const d=state.data,m=state.month,first=new Date(Date.UTC(+m.slice(0,4),+m.slice(5)-1,1)).getUTCDay(),days=lastDay(m),today=seoulToday();
  const prev=shiftMonth(m,-1),prevDays=lastDay(prev),cells=[];
  for(let i=first-1;i>=0;i--)cells.push({out:true,n:prevDays-i});
  for(let n=1;n<=days;n++){const ds=m+'-'+String(n).padStart(2,'0');cells.push({n,ds,sum:d.daily?.[ds]})}
  let k=1;while(cells.length%7)cells.push({out:true,n:k++});
  return `<section class="panel">
    <div class="panel-head"><h2>${slotIcon('calendar')}달력 보기</h2></div>
    <div class="weekdays">${WEEK.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="grid">${cells.map(c=>c.out?`<div class="cell out"><span class="d">${c.n}</span></div>`:`<button class="cell ${c.ds===today?'today':''}" data-day="${c.ds}" aria-label="${dayLabel(c.ds)} ${c.sum?won(c.sum):'지출 없음'}"><span class="d">${c.n}</span>${c.sum?`<span class="m ${c.sum<0?'minus':''}">${commas(c.sum)}</span>`:''}</button>`).join('')}</div>
    <div class="calnote">날짜를 누르면 그날의 상세 내역이 열려요.</div>
  </section>`;
}
function groupLabel(g){return state.data.labels?.[g.color]||g.categories.join('·')}

/* ---------- sheets ---------- */
function openSheet(title,body,{icon,onMount}={}){
  const wrap=document.createElement('div');wrap.className='sheet-wrap';
  wrap.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-head"><h3>${icon||''}${esc(title)}</h3><button data-close aria-label="닫기">✕</button></div><div class="sheet-body">${body}</div></div>`;
  const close=()=>{wrap.remove();document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(e.key==='Escape')close()};
  wrap.addEventListener('click',e=>{if(e.target===wrap||e.target.closest('[data-close]'))close()});
  document.addEventListener('keydown',onKey);
  $('#sheets').append(wrap);
  onMount?.(wrap.querySelector('.sheet-body'),close);
  const f=wrap.querySelector('input:not([type=hidden]),select,textarea');if(f&&!('ontouchstart' in window))f.focus();
  return {el:wrap,close};
}
function bindAmount(input){input.addEventListener('input',()=>{const neg=input.value.trim().startsWith('-');const d=input.value.replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'');input.value=(neg?'-':'')+(d?Number(d).toLocaleString('ko-KR'):'')})}
async function busy(btn,fn,errEl){
  const all=btn.closest('.sheet')?.querySelectorAll('button')||[btn];all.forEach(b=>b.disabled=true);if(errEl)errEl.textContent='';
  try{await fn();return true}catch(e){if(errEl)errEl.textContent=e.message;else setStatus(e.message);return false}finally{all.forEach(b=>b.disabled=false)}
}
function catChips(selected,name='cat'){
  const cats=activeCats();
  if(!cats.length)return '<div class="err">유형이 없어요. 관리 탭에서 유형을 먼저 만들어 주세요.</div>';
  return `<div class="chips" role="radiogroup">${cats.map(c=>`<button type="button" class="chip" data-${name}="${esc(c.id)}" aria-pressed="${c.id===selected}" style="background:${esc(c.color)}">${iconHTML(c.icon,'')}${esc(c.name)}</button>`).join('')}</div>`;
}
function pickChips(body,name,cb){body.querySelectorAll(`[data-${name}]`).forEach(b=>b.addEventListener('click',()=>{body.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');cb(b.dataset[name])}))}

function expenseSheet(row,presetDate){
  const isNew=!row,r=row||{date:presetDate||(seoulToday().startsWith(state.month)?seoulToday():state.month+'-01'),category:activeCats()[0]?.id,merchant:'',amount:'',memo:''};

    <div class="actions">${isNew?'':'<button type="button" class="danger" data-del>삭제</button>'}<span class="grow"></span><button type="submit" class="primary">${isNew?'＋ 지출 추가':'저장'}</button></div>
  </form>`,{icon:slotIcon('records'),onMount(body,close){

/* ---------- auth ---------- */
function extractKey(v){v=String(v||'').trim();const m=v.match(/#k=([A-Za-z0-9_-]+)/);return m?decodeURIComponent(m[1]):v}
function logout(msg){store.del(KEY_STORE);key='';for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith(CACHE_STORE))store.del(k)}showLogin(msg)}
function showLogin(msg){$('#app').classList.add('hidden');$('#tabbar').classList.add('hidden');$('#fab').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginErr').textContent=msg||''}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const k=extractKey($('#loginKey').value);if(!/^[A-Za-z0-9_-]{8,128}$/.test(k)){$('#loginErr').textContent='접근키 형식을 확인해 주세요.';return}
  key=k;const btn=e.submitter||$('#loginForm button');btn.disabled=true;
  try{await api('load',{month:state.month});store.set(KEY_STORE,k);start()}catch(err){$('#loginErr').textContent=err.message;key=''}finally{btn.disabled=false}});

function boot(){
  const fromHash=extractKey(location.hash.startsWith('#k=')?location.hash:'');
  if(fromHash&&/^[A-Za-z0-9_-]{8,128}$/.test(fromHash)){store.set(KEY_STORE,fromHash);history.replaceState(null,'',location.pathname+location.search)}
  key=store.get(KEY_STORE)||'';

  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

function demoAPI(path,d){
  if(!demoState){try{demoState=JSON.parse(store.get(DEMO_STORE))}catch{}demoState ||= initialDemo()}
  const s=demoState;
  switch(path){
    case'load':{const rows=[...s.rows.filter(r=>r.date.startsWith(d.month)),...fixedForMonth(s.fixed,d.month).map(r=>({...r,id:'fixed:'+r.key+':'+d.month,fixedKey:r.key,date:d.month+'-'+String(Math.min(r.day,lastDay(d.month))).padStart(2,'0')}))].sort((a,b)=>b.date.localeCompare(a.date));
      const daily={},groups=new Map(),cm=new Map(s.categories.map(c=>[c.id,c]));for(const r of rows){daily[r.date]=(daily[r.date]||0)+r.amount;const c=cm.get(r.category)||{id:r.category,name:'미분류',color:'#d9d0c5'};const k=c.color.toLowerCase();if(!groups.has(k))groups.set(k,{color:k,total:0,categories:[],ids:[]});const g=groups.get(k);g.total+=r.amount;if(!g.ids.includes(c.id)){g.ids.push(c.id);g.categories.push(c.name)}}
      return structuredClone({rows,daily,total:rows.reduce((a,r)=>a+r.amount,0),groups:[...groups.values()].sort((a,b)=>b.total-a.total),categories:s.categories,icons:s.icons,colors:s.colors,labels:s.labels,fixed:s.fixed,installments:s.installments,monthlyTitle:s.monthlyTitle,emojiGroups:s.emojiGroups,budget:s.budgets[d.month]??1000000})}
    case'emojis':return {items:DEMO_ICONS,cursor:null};
    case'expense':if(!d.merchant)throw Error('사용처를 입력해 주세요.');if(d.id)s.rows=s.rows.map(r=>r.id===d.id?{...d}:r);else s.rows.push({...d,id:uuid()});break;
    case'delete':s.rows=s.rows.filter(r=>r.id!==d.id);break;
    case'budget':s.budgets[d.month]=d.value;break;
    case'category':if(!d.name)throw Error('유형 이름을 입력해 주세요.');if(s.categories.some(c=>!c.inactive&&c.name===d.name&&c.id!==d.id))throw Error('이미 있는 유형 이름이에요.');if(d.id)s.categories=s.categories.map(c=>c.id===d.id?{...c,...d}:c);else s.categories.push({...d,id:uuid()});break;
    case'category-delete':s.categories=s.categories.map(c=>c.id===d.id?{...c,inactive:true}:c);break;
    case'color':s.colors=[...new Set([...s.colors,d.color])];break;
    case'icon':s.icons[d.slot]=d.icon;break;
    case'fixed':s.fixed=s.fixed.filter(r=>!(r.key===d.key&&r.from===d.from));s.fixed.push(d.stopped?{key:d.key,from:d.from,stopped:true}:{...d,stopped:false});break;
    case'installment':s.installments.push({...d,key:d.inputId,id:uuid(),done:[],cancelled:false});break;
    case'installment-cancel':s.installments=s.installments.map(p=>p.id===d.id?{...p,cancelled:true}:p);break;
    case'installment-sync':return {created:0};
    case'monthly-title':s.monthlyTitle=d.title||'월 결산';break;
    case'summary-label':s.labels[d.color]=d.label;break;
    default:throw Error('미리보기에서 지원하지 않는 기능이에요.');
  }
  store.set(DEMO_STORE,JSON.stringify(s));return {ok:true};
}
boot();
</script>
